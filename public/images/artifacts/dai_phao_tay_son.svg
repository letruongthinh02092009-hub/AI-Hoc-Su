<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGlowPhao" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#241c18" />
      <stop offset="100%" stop-color="#090807" />
    </radialGradient>
    <linearGradient id="bronzeGradient" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5a4228" />
      <stop offset="25%" stop-color="#a67c42" />
      <stop offset="50%" stop-color="#d4af67" />
      <stop offset="75%" stop-color="#8c6231" />
      <stop offset="100%" stop-color="#402e1c" />
    </linearGradient>
    <linearGradient id="woodCarriage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a2e12" />
      <stop offset="100%" stop-color="#2c1406" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgGlowPhao)" />
  
  <!-- Museum Ground Platform -->
  <polygon points="50,490 750,490 710,550 90,550" fill="#151311" stroke="#332c25" stroke-width="2" />
  <ellipse cx="400" cy="495" rx="300" ry="35" fill="#000" opacity="0.6" filter="blur(16px)" />

  <!-- Wooden Carriage -->
  <polygon points="260,380 540,360 560,450 240,460" fill="url(#woodCarriage)" stroke="#1a0b03" stroke-width="3" />
  
  <!-- Left Spoked Wheel -->
  <circle cx="280" cy="440" r="75" fill="#2d170a" stroke="#d4af67" stroke-width="7" />
  <circle cx="280" cy="440" r="60" fill="none" stroke="#1c0f07" stroke-width="4" />
  <circle cx="280" cy="440" r="22" fill="#a67c42" stroke="#fff" stroke-width="2" />
  <!-- Spokes -->
  <line x1="280" y1="365" x2="280" y2="515" stroke="#d4af67" stroke-width="5" />
  <line x1="205" y1="440" x2="355" y2="440" stroke="#d4af67" stroke-width="5" />
  <line x1="227" y1="387" x2="333" y2="493" stroke="#d4af67" stroke-width="5" />
  <line x1="227" y1="493" x2="333" y2="387" stroke="#d4af67" stroke-width="5" />

  <!-- Cannon Barrel (Cast Bronze with Dragon Relief) -->
  <g transform="rotate(-12, 380, 310)">
    <polygon points="140,290 620,298 620,332 140,340" fill="url(#bronzeGradient)" stroke="#261b11" stroke-width="3" />
    <!-- Muzzle Band -->
    <rect x="615" y="293" width="22" height="44" rx="4" fill="#e5a93c" stroke="#402e1c" stroke-width="2" />
    <ellipse cx="637" cy="315" rx="6" ry="21" fill="#18110b" />
    <!-- Reinforce Rings -->
    <rect x="520" y="295" width="14" height="40" rx="2" fill="#c6934b" />
    <rect x="420" y="293" width="16" height="44" rx="2" fill="#c6934b" />
    <rect x="300" y="291" width="18" height="48" rx="2" fill="#c6934b" />
    <!-- Breech Knob (Cascabel) -->
    <ellipse cx="130" cy="315" rx="18" ry="24" fill="#a67c42" />
    <circle cx="112" cy="315" r="12" fill="#8c6231" />
    <!-- Dragon Inscription -->
    <text x="360" y="318" fill="#ffe29a" font-family="serif" font-weight="bold" font-size="13" letter-spacing="4">大越西山神威大將軍</text>
  </g>

  <!-- Right Spoked Wheel -->
  <circle cx="500" cy="430" r="70" fill="#2d170a" stroke="#d4af67" stroke-width="7" />
  <circle cx="500" cy="430" r="20" fill="#a67c42" />
  <line x1="500" y1="360" x2="500" y2="500" stroke="#d4af67" stroke-width="5" />
  <line x1="430" y1="430" x2="570" y2="430" stroke="#d4af67" stroke-width="5" />

  <!-- Cannon Balls Pyramid -->
  <g transform="translate(620, 460)">
    <circle cx="0" cy="0" r="18" fill="#2b2d30" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="34" cy="0" r="18" fill="#35383d" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="68" cy="0" r="18" fill="#2b2d30" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="17" cy="-28" r="18" fill="#3a3d43" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="51" cy="-28" r="18" fill="#2b2d30" stroke="#1a1a1a" stroke-width="2" />
    <circle cx="34" cy="-56" r="18" fill="#464a52" stroke="#1a1a1a" stroke-width="2" />
  </g>

  <!-- Museum Title Plaque -->
  <rect x="220" y="525" width="360" height="42" rx="6" fill="#1c1917" stroke="#e5a93c" stroke-width="1.5" />
  <text x="400" y="551" fill="#f4d06f" font-family="'Be Vietnam Pro', sans-serif" font-size="13" font-weight="600" text-anchor="middle">
    BẢO VẬT: ĐẠI PHÁO THẦN CÔNG ĐÚC ĐỒNG NGUYÊN KHỐI
  </text>
</svg>